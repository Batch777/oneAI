name: Core and client checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[dev,outlook,papers]'
      - run: python -m pytest -q
      - run: node --check oneai/web/static/app.js && node --check oneai/web/static/sw.js
      - run: node --test tests/client/*.test.cjs
