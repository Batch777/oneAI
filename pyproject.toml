[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oneai"
version = "0.1.0"
description = "Local-first AI personal assistant: markdown knowledge base, Outlook drafts, iCloud sync"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
outlook = ["msal>=1.30"]
legacy = ["textual>=0.80", "Pillow>=10.0"]

[tool.pytest.ini_options]
testpaths = ["tests/core"]

[project.scripts]
oneai = "oneai.cli:main"

[tool.setuptools.packages.find]
include = ["oneai*", "connectors*"]
