[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oneai"
version = "0.1.0"
description = "Local-first AI personal assistant: markdown knowledge base, Outlook drafts, iCloud sync"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "msal>=1.30",
    "python-frontmatter>=1.1",
    "watchdog>=4.0",
    "textual>=0.80",
    "Pillow>=10.0",
]

[project.scripts]
oneai = "oneai.cli:main"

[tool.setuptools.packages.find]
include = ["oneai*", "connectors*"]
